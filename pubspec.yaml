name: foil_card
description: >-
  Holographic foil and flash-card effects for any Flutter image: rainbow,
  glitter, silver and twinkling star / heart finishes in one fragment shader
  pass, lit by touch or the device gyroscope.
version: 0.1.0
repository: https://github.com/TIANLI0/foil_card
issue_tracker: https://github.com/TIANLI0/foil_card/issues

environment:
  sdk: ^3.6.0
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  shaders:
    - shaders/foil_surface.frag

topics:
  - shaders
  - animation
  - ui
  - effects
  - card
